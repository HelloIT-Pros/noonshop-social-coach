<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noonshop Social Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f1; --surface:#ffffff; --ink:#1a1917; --muted:#625f58; --line:#e2dfd8; --accent:#1f4a44; --accent-soft:#e6efed;
  --good:#1d7a4a; --good-soft:#e3f3ea; --warn:#9a6200; --warn-soft:#fbf0dc; --bad:#b4262c; --bad-soft:#fbe5e6;
  --font-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131312; --surface:#1b1b1a; --ink:#ebe9e4; --muted:#a19d94; --line:#2f2e2b; --accent:#7fc4b8; --accent-soft:#1f2e2b;
    --good:#5cc98f; --good-soft:#16301f; --warn:#e7b250; --warn-soft:#33280f; --bad:#f07a7e; --bad-soft:#3a1a1c; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131312; --surface:#1b1b1a; --ink:#ebe9e4; --muted:#a19d94; --line:#2f2e2b; --accent:#7fc4b8; --accent-soft:#1f2e2b;
  --good:#5cc98f; --good-soft:#16301f; --warn:#e7b250; --warn-soft:#33280f; --bad:#f07a7e; --bad-soft:#3a1a1c; color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding:20px 20px 48px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;flex:1 1 520px;min-width:0}
.logo{display:inline-flex;flex:none;border-radius:4px}
.logo img{display:block;height:40px;width:auto;filter:brightness(0)}
:root[data-theme="dark"] .logo img{filter:none}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.controls{display:flex;align-items:flex-end;gap:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.field select{padding:7px 30px 7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:14px;min-width:190px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:35px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:13.5px}
.icon-btn:hover{border-color:var(--muted)}
.thumb{width:44px;height:78px;object-fit:cover;border-radius:4px;background:var(--line);display:block}
.p-thumb{width:72px;height:128px;object-fit:cover;border-radius:5px;background:var(--line);flex:none}
.title-line{display:block}
.pop{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;vertical-align:-5px;margin-left:4px;border-radius:5px;color:var(--muted);border:1px solid transparent}
.pop:hover{color:var(--accent);border-color:var(--line);background:var(--surface)}
.pop .icon{width:14px;height:14px}
.sort{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.sort:hover{color:var(--ink)}
.sort[aria-sort="ascending"],.sort[aria-sort="descending"]{color:var(--ink);font-weight:600}
.sort .arr{font-size:10px;width:8px}
.list-head .r{display:flex;justify-content:flex-end;align-items:center}

.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:16px 0;border:1px solid var(--line);background:var(--surface);border-radius:6px}
.insights div{padding:12px 16px;border-left:1px solid var(--line)}
.insights div:first-child{border-left:0}
.insights b{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:2px}
.insights span{font-size:14px}

.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.list{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.list-head{border-radius:6px 6px 0 0}
.foot{border-radius:0 0 6px 6px}
.info{position:relative;display:inline-flex;vertical-align:middle;margin-left:3px}
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:50%}
.info-btn:hover,.info.open .info-btn{color:var(--accent)}
.info-btn .icon{width:14px;height:14px}
.tip{display:none;position:absolute;top:calc(100% + 8px);right:-10px;width:290px;z-index:20;padding:12px 14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);font-size:13px;line-height:1.5;font-weight:400;text-transform:none;letter-spacing:normal;text-align:left;white-space:normal}
.tip.left{right:auto;left:-10px}
.tip b{display:block;margin-bottom:4px;font-size:13.5px}
.tip p{margin:0 0 6px}
.tip p:last-child{margin-bottom:0}
.tip .eq{font-family:var(--font-num);font-size:12.5px;background:var(--bg);padding:6px 8px;border-radius:4px;margin:6px 0}
.info:hover .tip,.info.open .tip,.info:focus-within .tip{display:block}
.tip,.tip p,.tip b{font-family:var(--font-body)}
.stats .tip{font-size:13px;font-family:var(--font-body)}
.stats .tip b{text-transform:none;letter-spacing:normal;color:var(--ink);font-size:13.5px;font-weight:600}
.stats .tip .eq{font-family:var(--font-num)}
.list-head,.row{display:grid;grid-template-columns:30px 44px minmax(0,1fr) 62px 70px;gap:10px;align-items:center;padding:10px 14px}
.list-head{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.list-head .r,.row .r{text-align:right}
.row{border-bottom:1px solid var(--line);cursor:pointer}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row:last-child{border-bottom:0}
.chips{display:flex;gap:4px;margin:3px 0 2px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.row:hover{background:var(--bg)}
.row[aria-selected="true"]{background:var(--accent-soft)}
.rank{font-family:var(--font-num);color:var(--muted);font-size:13px}
.who{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hook{font-weight:600;font-size:14px;line-height:1.35;margin-top:1px}
.score{font-family:var(--font-num);font-weight:500;font-size:15px}
.score small{color:var(--muted);font-weight:400}
.views{font-family:var(--font-num);font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pill.low{background:var(--good-soft);color:var(--good)}
.pill.med{background:var(--warn-soft);color:var(--warn)}
.pill.high{background:var(--bad-soft);color:var(--bad)}
.foot{padding:12px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--bg)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.p-head{padding:16px 18px 0}
.p-head .who{font-size:13px}
.p-head h2{font-size:19px;line-height:1.3;margin:4px 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:10px 12px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0;padding-left:18px}
.stats b{display:block;font-size:11.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.stats span{font-family:var(--font-num);font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f1a18}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1a18}}
.btn:disabled{opacity:.6;cursor:wait}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 4px;margin-right:14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.p-body{padding:16px 18px 20px;overflow:auto}
.sec{margin-bottom:16px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:5px}
.sec p{margin:0;max-width:65ch}
.beats{margin:0;padding:0;list-style:none;counter-reset:b}
.beats li{counter-increment:b;display:grid;grid-template-columns:22px 1fr;gap:6px;padding:4px 0}
.beats li::before{content:counter(b);font-family:var(--font-num);font-size:12px;color:var(--muted);padding-top:2px}
.watch{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.watch .pill{margin-top:2px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:12px}
.form label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.form input,.form select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.full{grid-column:1/-1}
.script{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.script-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.line{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 12px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .say{font-size:15px;font-weight:500}
.line .dir{font-size:12.5px;color:var(--muted)}
.cap{padding:10px 12px;font-size:13.5px;border-top:1px solid var(--line);background:var(--bg)}
.flags{display:grid;gap:8px;margin-top:12px}
.flag{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:13.5px}
.flag q{font-weight:600;quotes:none}
.tweaks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tweaks button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.tweaks button:hover{border-color:var(--muted)}
.ask{display:flex;gap:8px;margin-top:8px}
.ask input{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.status{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.2em}
.err{color:var(--bad)}

.vnav{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.vnav a{display:inline-flex;align-items:center;gap:7px;padding:11px 12px 10px;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.vnav a:hover{color:var(--ink)}
.vnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
#v-reels .insights{margin-top:0}
.block{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:20px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.block-head h2{font-size:15px;font-weight:600}
.block-head span{font-size:12.5px;color:var(--muted)}
.empty{padding:16px 14px;color:var(--muted);font-size:14px}
.chip.new{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.hot{background:var(--good-soft);border-color:transparent;color:var(--good)}
.nrow{display:grid;grid-template-columns:30px 44px minmax(0,1fr) 62px 70px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.nrow:last-child{border-bottom:0}
.nrow:hover{background:var(--bg)}
.nrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fhead,.frow{display:grid;grid-template-columns:minmax(0,1fr) 56px 82px 70px 104px 26px;gap:10px;align-items:center;padding:10px 14px}
.fhead{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.fhead .r,.frow .r{text-align:right}
.frow{border-bottom:1px solid var(--line);cursor:pointer;width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
.frow:hover{background:var(--bg)}
.frow .fname{font-weight:600;font-size:14.5px}
.frow .fnote{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.frow .tw{transition:transform .15s}
.frow[aria-expanded="true"] .tw{transform:rotate(180deg)}
.frow .num{font-size:14px}
.fsub{background:var(--bg);border-bottom:1px solid var(--line)}
.fsub .nrow{background:none}
.fsub .nrow:hover{background:var(--surface)}
.qitem{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:14px;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qn{font-family:var(--font-num);font-size:20px;line-height:1.1}
.qn small{display:block;font-family:var(--font-body);font-size:11.5px;color:var(--muted);margin-top:2px}
.qitem h3{font-size:15px;font-weight:600;line-height:1.35}
.qex{margin:6px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--muted)}
.qex li{padding:1px 0}
.qidea{margin-top:8px;font-size:14px}
.qidea b{font-weight:600}
.qsrc{margin-top:6px;font-size:12.5px;color:var(--muted)}
.qsrc a{color:var(--muted)}
.qsrc a:hover{color:var(--accent)}
.lead{font-size:13.5px;color:var(--muted);margin:0 0 14px;max-width:80ch}

@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .panel{position:static;max-height:none}
  .insights{grid-template-columns:1fr}
  .insights div{border-left:0;border-top:1px solid var(--line)}
  .insights div:first-child{border-top:0}
}
@media (max-width:520px){
  .brand{flex-direction:column;align-items:flex-start;gap:10px}
  .list-head,.row{grid-template-columns:22px 44px minmax(0,1fr) 54px}
  .list-head .c-views,.row .c-views,.list-head .c-risk,.row .c-risk{display:none}
  .nrow{grid-template-columns:22px 44px minmax(0,1fr) 54px}
  .nrow .c-views{display:none}
  .fhead,.frow{grid-template-columns:minmax(0,1fr) 70px 26px}
  .fhead .c-x,.frow .c-x{display:none}
  .qitem{grid-template-columns:1fr;gap:6px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats div:nth-child(3){border-left:0;padding-left:18px}
  .form{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">

<script>
const fmt = n => n>=1e6 ? (n/1e6).toFixed(1)+"M" : n>=1e3 ? Math.round(n/1e3)+"K" : String(n);
const fmtFull = n => n.toLocaleString("en-US");
const fmtDate = s => new Date(s+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const riskLabel = {low:"Low", med:"Medium", high:"High"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function prep(list){
  list.forEach(r => { r.score = r.views / r.med; r.eng = (r.likes + r.comments) / r.views * 100; });
  list.sort((a,b) => b.score - a.score);
  list.forEach((r,i) => { r.rank = i + 1; });
}
let TOPICS = {}, TOPIC_ORDER = [], ALL = [];
const TP = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAA4KCw0LCQ4NDA0QDw4RFiQXFhQUFiwgIRokNC43NjMuMjI6QVNGOj1OPjIySGJJTlZYXV5dOEVmbWVabFNbXVn/2wBDAQ8QEBYTFioXFypZOzI7WVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVn/wAARCACAAEgDASIAAhEBAxEB/8QAG";
const thumbOf = r => !r.thumb ? "" : (r.thumb.startsWith("data:") ? r.thumb : TP + r.thumb);
let topic = "tryon";
let LIST = [];
const riskOrder = {high:3, med:2, low:1};

let selectedId = null, tab = "breakdown";
let sortKey = "rank", sortDir = "asc";
const cur = () => LIST.find(r => r.id === selectedId);
function view(){
  const k = {rank:r=>r.rank, score:r=>r.score, views:r=>r.views, risk:r=>riskOrder[r.risk]*1e9 + r.score}[sortKey];
  return LIST.slice().sort((a,b) => sortDir === "asc" ? k(a)-k(b) : k(b)-k(a));
}
function scoreInfo(align, r){
  const ex = r || LIST[0];
  const t = TOPICS[topic];
  return `<span class="info"><button type="button" class="info-btn" aria-label="How the score is calculated"><svg class="icon"><use href="#i-info"/></svg></button><span class="tip ${align||''}" role="tooltip">
    <b>What the score means</b>
    <p>How far a Reel beat its creator's normal views. It shows the idea broke out, not just that the account is big.</p>
    <div class="eq">Score = Reel views &divide; creator's typical views</div>
    <p>Typical views = the median of the creator's latest 20 Reels.</p>
    ${ex ? `<p>Example (@${esc(ex.user)}): ${fmtFull(ex.views)} &divide; ${fmtFull(Math.round(ex.med))} = ${Math.round(ex.score)}x.</p>` : ""}
    <p>A 3x score or higher counts as a breakout.${t && t.pulled ? ` Views are as shown on Instagram on ${fmtDate(t.pulled)}.` : ""}</p>
  </span></span>`;
}
function wireInfo(root){
  root.querySelectorAll(".info-btn").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const box = b.closest(".info"); const open = box.classList.toggle("open");
    b.setAttribute("aria-expanded", open);
  });
}
document.addEventListener("click", e => { if (!e.target.closest(".info")) document.querySelectorAll(".info.open").forEach(x => x.classList.remove("open")); });
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".info.open").forEach(x => x.classList.remove("open")); });
const COLS = [["rank","#",""],[null,"",""],[null,"Reel",""],["score","Score","r"],["views","Views","r c-views"]];
function renderHead(){
  document.getElementById("head").innerHTML = COLS.map(([k,l,c]) => k
    ? `<span class="${c}"><button class="sort" data-k="${k}" aria-sort="${sortKey===k ? (sortDir==='asc'?'ascending':'descending') : 'none'}">${l}<span class="arr">${sortKey===k ? (sortDir==='asc'?'&#9650;':'&#9660;') : ''}</span></button>${k==='score' ? scoreInfo() : ''}</span>`
    : `<span class="${c}">${l}</span>`).join("");
  wireInfo(document.getElementById("head"));
  document.querySelectorAll(".sort").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (sortKey === k) sortDir = sortDir === "asc" ? "desc" : "asc";
    else { sortKey = k; sortDir = k === "rank" ? "asc" : "desc"; }
    renderHead(); renderRows();
  });
}
const chipsOf = r => r.product ? `<div class="chips">${topic === "all" && TOPICS[r.topic] ? `<span class="chip">${esc(TOPICS[r.topic].label)}</span>` : ""}<span class="chip">${esc(r.product)}</span>${r.lang ? `<span class="chip">${esc(r.lang)}</span>` : ''}${r.steady ? `<span class="chip">Steady performer</span>` : ''}${r.boosted ? `<span class="chip">Likely paid boost</span>` : ''}</div>` : '';

function renderRows(){
  document.getElementById("rows").innerHTML = view().map(r => `
    <div class="row" role="option" tabindex="0" aria-selected="${r.id===selectedId}" data-id="${r.id}">
      <span class="rank">${r.rank}</span>
      <img class="thumb" src="${esc(thumbOf(r))}" alt="" loading="lazy">
      <span><div class="who">@${esc(r.user)} &middot; ${fmtDate(r.date)}</div>${chipsOf(r)}<div class="title-line"><span class="hook">${esc(r.hook)}</span><a class="pop" href="https://www.instagram.com/reel/${r.id}/" target="_blank" rel="noopener" title="Open Reel on Instagram" aria-label="Open Reel on Instagram"><svg class="icon"><use href="#i-ext"/></svg></a></div></span>
      <span class="r score">${Math.round(r.score)}<small>x</small></span>
      <span class="r views c-views">${fmt(r.views)}</span>
    </div>`).join("");
  document.querySelectorAll(".row").forEach(b => {
    const pick = () => { selectedId = b.dataset.id; renderRows(); renderPanel(); };
    b.addEventListener("click", e => { if (e.target.closest(".pop")) return; pick(); });
    b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
}

function renderPanel(){
  const r = cur();
  if (!r){ document.getElementById("panel").innerHTML = `<div class="p-body"><p class="note">${STATUS || "No Reels in this topic yet."}</p></div>`; return; }
  const p = document.getElementById("panel");
  p.innerHTML = `
    <div class="p-head" style="display:flex;gap:14px;align-items:flex-start;padding-bottom:14px">
      <img class="p-thumb" src="${esc(thumbOf(r))}" alt="Cover frame of the Reel">
      <div style="min-width:0">
        <div class="who">#${r.rank} &middot; @${esc(r.user)} &middot; ${esc(r.name)}</div>${chipsOf(r)}
        <div class="title-line" style="margin-top:4px"><h2 style="margin:0">${esc(r.hook)}<a class="pop" href="https://www.instagram.com/reel/${r.id}/" target="_blank" rel="noopener" title="Open Reel on Instagram" aria-label="Open Reel on Instagram"><svg class="icon"><use href="#i-ext"/></svg></a></h2></div>
      </div>
    </div>
    <div class="stats">
      <div><b>Score${scoreInfo('left', r)}</b><span>${Math.round(r.score)}x</span></div>
      <div><b>Views</b><span>${fmtFull(r.views)}</span></div>
      <div><b>Typical</b><span>${fmtFull(Math.round(r.med))}</span></div>
      <div><b>Engage</b><span>${r.eng.toFixed(1)}%</span></div>
    </div>
    <div class="actions">
      <a class="btn" href="https://www.instagram.com/reel/${r.id}/" target="_blank" rel="noopener"><svg class="icon"><use href="#i-ext"/></svg>Open Reel</a>
      <span class="who">${r.dur}s &middot; ${fmtFull(r.likes)} likes &middot; ${fmtFull(r.comments)} comments</span>
    </div>
    <div class="p-body" id="pbody"></div>`;
  wireInfo(p);
  renderBreakdown(r);
}

function renderBreakdown(r){
  document.getElementById("pbody").innerHTML = `
    <div class="sec"><h3>Hook</h3><p>${esc(r.hook)}</p></div>
    <div class="sec"><h3>Angle</h3><p>${esc(r.angle)}</p></div>
    <div class="sec"><h3>Structure</h3><ol class="beats">${r.beats.map(b=>`<li><span>${esc(b)}</span></li>`).join("")}</ol></div>
    <div class="sec"><h3>Call to action</h3><p>${esc(r.cta)}</p></div>
    <div class="sec"><h3>Why it ranked</h3><p>${esc(r.why)}</p></div>
    <div class="sec"><h3>Watch-out</h3><p>${esc(r.watch)}</p></div>
    <p class="note">Breakdown is built from the caption and stats. Watch the Reel for the full picture.</p>`;
}

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  const b = document.getElementById("theme");
  const dark = t === "dark";
  b.innerHTML = `<svg class="icon"><use href="#i-${dark?'sun':'moon'}"/></svg><span>${dark?'Light':'Dark'}</span>`;
  b.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
}
let startTheme = null;
try { startTheme = localStorage.getItem("noonshop-coach-theme"); } catch(e){}
applyTheme(startTheme === "dark" ? "dark" : "light");
document.getElementById("theme").onclick = () => {
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(t); try { localStorage.setItem("noonshop-coach-theme", t); } catch(e){}
};

let STATUS = "Loading Reels...";
let VIEW = "new", UPDATED = "", openFormat = null;
const RECENT_DAYS = 90, NEW_DAYS = 14;
const FORMAT_NOTES = {
  "Fit fix": "Show the fit problem on a real face, then the frame that fixes it. Noon Shop's strongest lane.",
  "Face shape and size": "Go past the face-shape chart. Talk bridge, width and eye size on real faces.",
  "Try-on and glow-up": "One person, quick cuts, several frames. Say so on screen if frames were gifted or paid.",
  "Pick one": "Two to four frames and one question: which pair? The comments do the work.",
  "Shop skit": "A 10-second moment from the optical counter. Easy for practice accounts to film.",
  "Relatable question": "One either-or question every glasses wearer has an answer to.",
  "Doctor tip": "A quick check or habit fix from an eye doctor. General education only, no diagnosis.",
  "Behind the counter": "Show the craft: adjustments, lens work, fittings. Builds trust in the shop."
};
const days = (a,b) => (new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 864e5;
const isRecent = r => UPDATED && days(r.date, UPDATED) <= RECENT_DAYS;
const isNew = r => !!r.added && UPDATED && days(r.added, UPDATED) <= NEW_DAYS;
const median = a => { if (!a.length) return 0; const s = a.slice().sort((x,y)=>x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; };
const topicLabel = id => TOPICS[id] ? TOPICS[id].label : id;
function inScope(){ const l = topic === "all" ? ALL : ALL.filter(r => r.topic === topic); return l.map(r => ({...r})); }
function scoped(){ const l = inScope(); prep(l); return l; }

function renderTopic(){
  const t = TOPICS[topic];
  document.getElementById("insights").innerHTML = t ? (t.insights||[]).map(x => `<div><b>${esc(x.title)}</b><span>${esc(x.text)}</span></div>`).join("") : "";
  document.getElementById("insights").hidden = !(t && t.insights && t.insights.length);
  document.getElementById("foot").textContent = t ? (t.foot||"") : (topic === "all" ? "All topics together, ranked by score. Pick a topic above to see how each list was made." : "");
  const p = t ? t.pulled : TOPIC_ORDER.map(id => TOPICS[id].pulled).filter(Boolean).sort().pop();
  document.getElementById("pulled").textContent = p ? `Pulled ${fmtDate(p)}.` : "";
}
function renderTopicMenu(){
  const s = document.getElementById("topic");
  s.innerHTML = TOPIC_ORDER.length ? `<option value="all" ${topic==="all"?"selected":""}>All topics</option>` + TOPIC_ORDER.map(id => `<option value="${esc(id)}" ${id===topic?"selected":""}>${esc(TOPICS[id].label)}</option>`).join("") : `<option>${STATUS ? "Loading..." : "No topics yet"}</option>`;
}
function setTopic(id, keepSel){
  topic = id;
  LIST = scoped();
  if (!keepSel || !LIST.find(r => r.id === selectedId)) { selectedId = LIST[0] ? LIST[0].id : null; tab = "breakdown"; }
  renderTopic(); renderHead(); renderRows(); renderPanel();
  renderView();
}

const chipsPlus = (r, opts) => `<div class="chips">${opts.topic && topic === "all" ? `<span class="chip">${esc(topicLabel(r.topic))}</span>` : ""}<span class="chip">${esc(r.format)}</span>${isNew(r) ? `<span class="chip new">New</span>` : ""}${r.boosted ? `<span class="chip">Likely paid boost</span>` : ""}</div>`;
function nrows(list){
  return list.map((r,i) => `
    <div class="nrow" role="link" tabindex="0" data-id="${r.id}" aria-label="Open breakdown: ${esc(r.hook)}">
      <span class="rank">${i+1}</span>
      <img class="thumb" src="${esc(thumbOf(r))}" alt="" loading="lazy">
      <span><div class="who">@${esc(r.user)} &middot; ${fmtDate(r.date)}</div>${chipsPlus(r,{topic:true})}<div class="title-line"><span class="hook">${esc(r.hook)}</span><a class="pop" href="https://www.instagram.com/reel/${r.id}/" target="_blank" rel="noopener" title="Open Reel on Instagram" aria-label="Open Reel on Instagram"><svg class="icon"><use href="#i-ext"/></svg></a></div></span>
      <span class="r score">${Math.round(r.score)}<small>x</small></span>
      <span class="r views c-views">${fmt(r.views)}</span>
    </div>`).join("");
}
function wireNrows(root){
  root.querySelectorAll(".nrow").forEach(b => {
    const go = () => { selectedId = b.dataset.id; tab = "breakdown"; location.hash = "#reels"; };
    b.addEventListener("click", e => { if (e.target.closest(".pop")) return; go(); });
    b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}

function formatStats(list){
  const by = {};
  list.forEach(r => { (by[r.format] = by[r.format] || []).push(r); });
  return Object.keys(by).map(f => {
    const all = by[f].slice().sort((a,b) => b.score - a.score);
    const clean = all.filter(r => !r.boosted);
    const rec = all.filter(isRecent);
    return { f, reels: all, n: all.length, typ: median((clean.length ? clean : all).map(r => r.score)), best: all[0].score,
      recN: rec.length, recBest: rec.length ? rec[0].score : 0, hot: rec.some(r => !r.boosted && r.score >= 100) };
  }).sort((a,b) => b.typ - a.typ);
}

function renderNew(){
  const list = scoped();
  const recent = list.filter(isRecent).sort((a,b) => b.score - a.score);
  const fresh = list.filter(isNew).sort((a,b) => b.score - a.score);
  const big = recent.filter(r => r.score >= 100 && !r.boosted);
  const fs = formatStats(list).filter(x => x.recN).sort((a,b) => (b.hot - a.hot) || (b.recBest - a.recBest));
  const top = fs[0];
  const scope = topic === "all" ? "across all topics" : "in " + topicLabel(topic);
  const cells = [
    ["Fresh breakouts", big.length ? `${big.length} Reel${big.length>1?"s":""} posted in the last ${RECENT_DAYS} days beat the creator's normal views by 100x or more, ${scope}.` : `No 100x breakouts posted in the last ${RECENT_DAYS} days ${scope}.`],
    ["Format on a roll", top ? `${top.f}: ${top.recN} recent Reel${top.recN>1?"s":""}, best at ${Math.round(top.recBest)}x. ${FORMAT_NOTES[top.f] || ""}` : "Not enough recent Reels to call a format yet."],
    ["New since last refresh", fresh.length ? `${fresh.length} Reel${fresh.length>1?"s":""} joined the lists in the latest refresh. They are marked New.` : "This is the first pull. Reels that join the lists in future refreshes will be marked New here."]
  ];
  document.getElementById("v-new").innerHTML = `
    <section class="insights" style="margin-top:0">${cells.map(([b,t]) => `<div><b>${b}</b><span>${esc(t)}</span></div>`).join("")}</section>
    ${fresh.length ? `<section class="block"><div class="block-head"><h2>New since last refresh</h2><span>${fresh.length} Reels</span></div>${nrows(fresh)}</section>` : ""}
    <section class="block"><div class="block-head"><h2>Recent breakouts</h2><span>Posted in the last ${RECENT_DAYS} days, ranked by score${scoreInfo()}</span></div>
      ${recent.length ? nrows(recent) : `<div class="empty">No Reels from the last ${RECENT_DAYS} days ${scope}.</div>`}
    </section>`;
  const v = document.getElementById("v-new"); wireInfo(v); wireNrows(v);
}

function renderFormats(){
  const list = scoped();
  const fs = formatStats(list);
  const scope = topic === "all" ? "all topics" : topicLabel(topic);
  document.getElementById("v-formats").innerHTML = `
    <p class="lead">Every Reel is sorted into a format, so you can see which kind of post breaks out most often, not just which single post went viral. Typical score is the middle Reel in each format, with likely paid boosts left out. Click a format to see its Reels.</p>
    <section class="block">
      <div class="block-head"><h2>Format scoreboard</h2><span>${esc(scope)} &middot; ${list.length} Reels</span></div>
      <div class="fhead"><span>Format</span><span class="r c-x">Reels</span><span class="r">Typical${scoreInfo()}</span><span class="r c-x">Best</span><span class="r c-x">Last ${RECENT_DAYS} days</span><span></span></div>
      ${fs.map(x => `
        <button type="button" class="frow" data-f="${esc(x.f)}" aria-expanded="${openFormat===x.f}">
          <span><div class="fname">${esc(x.f)}${x.hot ? ` <span class="chip hot">On a roll</span>` : ""}</div><div class="fnote">${esc(FORMAT_NOTES[x.f] || "")}</div></span>
          <span class="r num c-x">${x.n}</span>
          <span class="r num">${Math.round(x.typ)}x</span>
          <span class="r num c-x">${Math.round(x.best)}x</span>
          <span class="r num c-x">${x.recN ? `${x.recN} &middot; ${Math.round(x.recBest)}x` : "None"}</span>
          <svg class="icon tw"><use href="#i-down"/></svg>
        </button>
        ${openFormat===x.f ? `<div class="fsub">${nrows(x.reels)}</div>` : ""}`).join("")}
    </section>`;
  const v = document.getElementById("v-formats"); wireInfo(v); wireNrows(v);
  v.querySelectorAll(".frow").forEach(b => b.onclick = e => { if (e.target.closest(".info")) return; openFormat = openFormat === b.dataset.f ? null : b.dataset.f; renderFormats(); });
}

function renderQuestions(){
  const ids = topic === "all" ? TOPIC_ORDER : [topic];
  const byId = Object.fromEntries(ALL.map(r => [r.id, r]));
  const blocks = ids.map(id => {
    const t = TOPICS[id] || {}, qs = (t.questions || []).slice().sort((a,b) => b.n - a.n);
    return `<section class="block"><div class="block-head"><h2>${esc(t.label || id)}</h2><span>${esc(t.qnote || "")}</span></div>
      ${qs.length ? qs.map(q => `
        <div class="qitem">
          <div class="qn">${q.n}<small>${q.n === 1 ? "comment" : "comments"}</small></div>
          <div>
            <h3>${esc(q.q)}</h3>
            ${q.ex && q.ex.length ? `<ul class="qex">${q.ex.map(e => `<li>&ldquo;${esc(e)}&rdquo;</li>`).join("")}</ul>` : ""}
            ${q.idea ? `<div class="qidea"><b>Post idea:</b> ${esc(q.idea)}</div>` : ""}
            ${q.reels && q.reels.length ? `<div class="qsrc">Asked on ${q.reels.filter(x => byId[x]).map(x => `<a href="https://www.instagram.com/reel/${x}/" target="_blank" rel="noopener">@${esc(byId[x].user)}</a>`).join(", ")}</div>` : ""}
          </div>
        </div>`).join("") : `<div class="empty">No comment themes pulled for this topic yet.</div>`}
    </section>`;
  }).join("");
  document.getElementById("v-questions").innerHTML = `<p class="lead">What people ask and complain about in the comments of the top Reels, grouped into themes. Every repeated question is a post idea, answering what buyers already want to know. Counts are comments that raised the theme in the comments we read, not every comment on the Reel.</p>${blocks}`;
}

function renderView(){
  ["reels","new","formats","questions"].forEach(v => { document.getElementById("v-"+v).hidden = v !== VIEW; });
  document.querySelectorAll("#views a").forEach(a => a.setAttribute("aria-current", a.dataset.v === VIEW ? "page" : "false"));
  if (!ALL.length) { if (VIEW !== "reels") document.getElementById("v-"+VIEW).innerHTML = `<div class="empty">${STATUS || "No data yet."}</div>`; return; }
  if (VIEW === "new") renderNew(); else if (VIEW === "formats") renderFormats(); else if (VIEW === "questions") renderQuestions();
}
function readHash(){
  const h = location.hash.slice(1);
  VIEW = ["reels","new","formats","questions"].includes(h) ? h : "new";
  if (VIEW === "reels" && selectedId) { renderRows(); renderPanel(); const el = document.querySelector(`.row[data-id="${CSS.escape(selectedId)}"]`); if (el) el.scrollIntoView({block:"nearest"}); }
  renderView();
}
document.getElementById("home").addEventListener("click", e => { e.preventDefault(); location.href = location.pathname; });
window.addEventListener("hashchange", () => { readHash(); window.scrollTo({top:0}); });

function renderAll(){
  if (topic !== "all" && !TOPICS[topic]) topic = "all";
  renderTopicMenu(); setTopic(topic, true);
}
document.getElementById("topic").addEventListener("change", e => {
  sortKey = "rank"; sortDir = "asc"; openFormat = null; setTopic(e.target.value, false);
});
topic = "all";
readHash();
renderAll();

fetch("data.json", {cache:"no-store"}).then(r => r.json()).then(d => {
  TOPICS = d.topics || {}; UPDATED = d.updated || "";
  TOPIC_ORDER = Object.keys(TOPICS).sort((a,b) => (TOPICS[a].order||99) - (TOPICS[b].order||99));
  ALL = (d.reels || []).map(r => ({...r, format: r.format || ((TOPICS[r.topic]||{}).formats||{})[r.id] || r.product || "Other"}));
  STATUS = ""; renderAll();
  const u = document.getElementById("updated"); if (u && d.updated) u.textContent = "Data updated " + fmtDate(d.updated) + ".";
}).catch(() => { STATUS = "The Reel data couldn't load. Reload the page to try again."; renderAll(); });
</script>
</body>
